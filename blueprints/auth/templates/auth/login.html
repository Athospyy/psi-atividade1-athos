{% extends 'base.html' %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<h1>Entrar</h1>

{% if erro %}
  <div class="card erro">{{ erro }}</div>
{% endif %}

<form method="post">
  <label>Nome de usuário</label>
  <input name="nome" required autofocus>
  <label>Senha</label>
  <input name="senha" type="password" required>
  <button type="submit">Entrar</button>
</form>

{% endblock %}
